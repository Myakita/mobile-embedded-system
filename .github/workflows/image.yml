name: image

# Yocto core-image-minimal + the edge service (yocto/meta-mes) in QEMU; see #18, #24.
# Heavy, so it is not on push: manual run or twice a week. The job summary records runner
# resources and build time.
on:
  workflow_dispatch:
  schedule:
    # Mon + Thu 04:00 UTC (Monday an hour after full.yml). Not weekly: GitHub evicts a cache unused
    # for 7 days, and a weekly run lands right on that edge, so a late start would find no cache
    # and rebuild cold (~3.5 h of the 300-minute timeout). A warm run is ~8 min.
    - cron: "0 4 * * 1,4"

permissions:
  contents: read
  actions: write # delete superseded yocto-* caches

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        # apt has no read timeout by default: a stalled Azure mirror once hung this step on
        # qemu-system-x86 indefinitely. Time out and retry instead; cap the step as a backstop.
        timeout-minutes: 15
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/99ci-retries >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo gcc build-essential chrpath socat cpio \
            python3 python3-pip python3-pexpect xz-utils debianutils iputils-ping \
            python3-git python3-jinja2 python3-subunit zstd liblz4-tool file locales \
            libacl1 qemu-system-x86
          pip install --break-system-packages -q kas==5.5
          # bitbake refuses to run as root or in a user namespace it cannot create (Ubuntu 24.04 AppArmor).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm: QEMU will fall back to TCG"

      # restore + save instead of actions/cache: that one saves only on success, and a failed
      # multi-hour build is exactly when the sstate is worth keeping. Unique key per run, since
      # an existing key is never overwritten; restore picks the newest one by prefix.
      - uses: actions/cache/restore@v4
        with:
          path: .yocto-cache
          key: yocto-${{ hashFiles('yocto/kas.yml') }}-${{ github.run_id }}
          restore-keys: |
            yocto-${{ hashFiles('yocto/kas.yml') }}-
            yocto-

      - name: Build image
        run: |
          start=$(date +%s)
          bash yocto/build.sh
          echo "build_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # Yocto only ever adds to sstate: every recipe change leaves the old objects behind, and the
      # cache (9.2 GB at #18) sits just under the repo's 10 GB quota. build/yocto is fresh each run,
      # so its stamps list exactly what this build used; drop the rest. Only after a successful
      # build: a failed one has partial stamps and would lose objects the next run still needs.
      - name: Prune sstate to this build
        run: |
          python3 poky/scripts/sstate-cache-management.py --cache-dir=.yocto-cache/sstate \
            --stamps-dir=build/yocto/tmp/stamps --remove-orphans --yes -j "$(nproc)"

      - name: Boot in QEMU
        # The line edge prints once vcan0 is open (rpi-app/main.cpp): proves the service was
        # packaged, autostarted by its init script, and found the virtual CAN interface.
        run: |
          BOOT_TIMEOUT=600 BOOT_EXPECT="edge: listening on vcan0" bash yocto/run-qemu.sh

      - name: Record resources
        id: resources
        if: always()
        run: |
          # A run cancelled before bitbake wrote anything would save an empty cache that, being
          # newest, shadows the real one on the next restore. Save only when sstate exists.
          [ -n "$(ls -A .yocto-cache/sstate 2>/dev/null)" ] && echo "has_sstate=1" >> "$GITHUB_OUTPUT"
          {
            echo "### Runner resources"
            echo "- CPUs: $(nproc), RAM: $(free -g | awk '/Mem/{print $2}') GB"
            echo "- Disk free after build: $(df -h / | awk 'NR==2{print $4}')"
            echo "- Build time: ${build_seconds:-n/a} s; /dev/kvm: $([ -w /dev/kvm ] && echo yes || echo no)"
            echo "- Cache: $(du -sh .yocto-cache 2>/dev/null | cut -f1) (sstate $(du -sh .yocto-cache/sstate 2>/dev/null | cut -f1), downloads $(du -sh .yocto-cache/downloads 2>/dev/null | cut -f1))"
            cache_kb=$(du -sk .yocto-cache 2>/dev/null | cut -f1)
            cache_gb=$(( ${cache_kb:-0} / 1024 / 1024 ))
            if [ "$cache_gb" -ge 8 ]; then
              echo "- **Cache is ${cache_gb} GB, near the 10 GB repo quota**: prune downloads/ or move sstate elsewhere"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save cache
        id: save
        if: always() && steps.resources.outputs.has_sstate == '1'
        uses: actions/cache/save@v4
        with:
          path: .yocto-cache
          key: yocto-${{ hashFiles('yocto/kas.yml') }}-${{ github.run_id }}

      # One ~9 GB copy per run would fill the repo's 10 GB cache quota and evict other caches
      # (the Android job's Gradle ones). Keep only the copy this run just saved.
      - name: Drop older Yocto caches
        if: always() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: yocto-${{ hashFiles('yocto/kas.yml') }}-${{ github.run_id }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key yocto- --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$KEEP\") | .id" |
            xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yocto-boot
          path: |
            build/yocto/boot.log
            build/yocto/tmp/deploy/images/qemux86-64/*.manifest
          if-no-files-found: warn
