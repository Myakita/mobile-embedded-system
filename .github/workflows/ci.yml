name: ci

# Fast loop for the emulator and the pinned Android and protocol submodules.
# Doesn't run on a docs-only change. There is no required-status-check gate on
# main; a failed job reports a red commit status. The heavier stand is in full.yml.
on:
  push:
    paths:
      - "emulator/**"
      - "Makefile"
      - "ci/**"
      - "mobile_app"
      - "protocol"
      - ".clang-format"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "emulator/**"
      - "Makefile"
      - "ci/**"
      - "mobile_app"
      - "protocol"
      - ".clang-format"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # guard's diff-stat report needs history, not just the tip

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make pkg-config meson ninja-build

      - name: Install libgpiod v2 (apt still ships v1 on this image)
        run: bash ci/install-libgpiod-v2.sh

      - name: Build and test
        run: make build test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results
          path: build/Testing/
          if-no-files-found: ignore

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install guard dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 python3-pip clang-format
          pip install --break-system-packages -q lizard

      - name: Run guard
        env:
          GUARD_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/guard.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true

    steps:
      - name: Check out pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Record checked-out revisions
        run: |
          mkdir -p ci-artifacts
          {
            printf 'system=%s\n' "$GITHUB_SHA"
            printf 'mobile_app=%s\n' "$(git -C mobile_app rev-parse HEAD)"
            printf 'protocol=%s\n' "$(git -C protocol rev-parse HEAD)"
            printf 'mobile_app/protocol=%s\n' "$(git -C mobile_app/protocol rev-parse HEAD)"
          } > ci-artifacts/revisions.txt
          cat ci-artifacts/revisions.txt

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and check pinned Android app
        working-directory: mobile_app
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK and unit test results
        run: |
          test -s mobile_app/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('mobile_app/app/build/test-results/testDebugUnitTest').glob('*.xml'))
          count = sum(int(ET.parse(path).getroot().attrib.get('tests', 0)) for path in reports)
          if count == 0:
              raise SystemExit('No Android JVM tests were reported')
          print(f'Android JVM tests reported: {count}')
          PY

      - name: Upload pinned Android APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pinned-android-check
          path: |
            ci-artifacts/revisions.txt
            mobile_app/app/build/outputs/apk/debug/app-debug.apk
            mobile_app/app/build/test-results/testDebugUnitTest/**
            mobile_app/app/build/reports/tests/testDebugUnitTest/**
            mobile_app/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
