# Test-only broker: TLS + ACL, no persistence, no backend. Paths are fixed container
# paths; certs/passwd are generated fresh by smoke.sh into ./generated (gitignored),
# never committed. See emulator/stand/smoke.sh and docs/CI.md.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

persistence false
log_dest stdout
