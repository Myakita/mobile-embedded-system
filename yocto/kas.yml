# Yocto 5.0 LTS (scarthgap), pinned to the yocto-5.0.20 release commit. Bump the commit
# on purpose, in its own change; never track the branch. See docs/CI.md.
# Not older than 5.0.20: its pseudo wraps openat2, which Ubuntu 24.04's tar (1.35+dfsg-3ubuntu0.4)
# uses on extract; with the 5.0.14 pseudo every do_package failed with "unknown directory, fd 4".
header:
  version: 14

machine: qemux86-64
distro: poky
target: core-image-minimal

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    commit: 64e69ed23703f6358ec431d3f5f1f8483f974cae
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

local_conf_header:
  # Shared caches live outside the build dir so a clean build dir still reuses downloads and sstate.
  caches: |
    DL_DIR ?= "${TOPDIR}/../../.yocto-cache/downloads"
    SSTATE_DIR ?= "${TOPDIR}/../../.yocto-cache/sstate"
