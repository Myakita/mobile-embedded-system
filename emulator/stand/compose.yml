services:
  broker:
    image: eclipse-mosquitto:2
    # Config, ACL, certs and passwords are all generated into ./generated by lib.sh (see
    # stand.env), so there is no second copy of any of them to keep in sync.
    command: /usr/sbin/mosquitto -c /mosquitto/generated/mosquitto.conf
    volumes:
      # generated/ (unlike passwd or certs/*.crt individually) exists from the
      # very start of smoke.sh, well before anything is written into it -- bind
      # mounting a single FILE that didn't exist yet at container-create time
      # silently gets an empty directory substituted for it on some Docker setups;
      # mounting the already-existing parent directory sidesteps that entirely.
      - ./generated:/mosquitto/generated:ro
