# Project layer: the edge service and the kernel bits it needs in the QEMU image.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mes"
BBFILE_PATTERN_mes = "^${LAYERDIR}/"
BBFILE_PRIORITY_mes = "10"

# openembedded-layer (meta-oe) provides libgpiod v2, which periph links against;
# networking-layer (meta-networking) provides libmosquitto for edge.
LAYERDEPENDS_mes = "core openembedded-layer networking-layer"
LAYERSERIES_COMPAT_mes = "scarthgap"
